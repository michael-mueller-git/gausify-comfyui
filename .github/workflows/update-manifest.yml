name: Update binaries manifest

# After a brush-cli release: hash its assets and open a PR that points
# gausify/binaries.json at it (version, URLs, sha256).

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (brush-vX.Y.Z)
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  manifest:
    if: startsWith(inputs.tag || github.event.release.tag_name, 'brush-v')
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download and hash assets
        run: |
          mkdir -p assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets --pattern 'brush-cli-*'
          cd assets
          for f in *.tar.xz *.zip; do
            [ -f "$f" ] || continue
            got="$(sha256sum "$f" | awk '{print $1}')"
            if [ -f "$f.sha256" ] && [ "$(tr -d ' \n' < "$f.sha256")" != "$got" ]; then
              echo "::error::sha256 of $f does not match $f.sha256"; exit 1
            fi
            echo "$f $got"
          done

      - name: Update gausify/binaries.json
        run: |
          python3 - <<'EOF'
          import hashlib, json, os, pathlib
          tag = os.environ["TAG"]
          version = tag.removeprefix("brush-v")
          repo = os.environ["GITHUB_REPOSITORY"]
          path = pathlib.Path("gausify/binaries.json")
          m = json.loads(path.read_text())
          entry = m["brush-cli"]
          entry["version"] = version
          ext = {"linux-x64": "tar.xz", "windows-x64": "zip"}
          for plat, p in entry["platforms"].items():
              name = f"brush-cli-{version}-{plat}.{ext[plat]}"
              asset = pathlib.Path("assets") / name
              if not asset.is_file():
                  raise SystemExit(f"missing release asset {name}")
              p["url"] = f"https://github.com/{repo}/releases/download/brush-v{{version}}/brush-cli-{{version}}-{plat}.{ext[plat]}"
              p["sha256"] = hashlib.sha256(asset.read_bytes()).hexdigest()
          path.write_text(json.dumps(m, indent=2) + "\n")
          EOF
          rm -rf assets
          git diff

      - uses: peter-evans/create-pull-request@v7.0.8
        with:
          branch: manifest/${{ env.TAG }}
          commit-message: "binaries.json: brush-cli ${{ env.TAG }}"
          title: "binaries.json: brush-cli ${{ env.TAG }}"
          body: |
            Points `gausify/binaries.json` at the `${{ env.TAG }}` release assets with their sha256.

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
          add-paths: gausify/binaries.json
