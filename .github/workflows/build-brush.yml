name: Build brush-cli

# brush-cli = Brush 38185de + gausify-orbit's patches + gausify-cli.patch
# (brush/build.sh), Linux x86-64 only. Tag `brush-vX.Y.Z` to publish a
# release; the manifest PR (gausify/binaries.json) follows via
# update-manifest.yml.

on:
  push:
    tags: ["brush-v*"]
    branches: [main]
    paths: ["brush/**", ".github/workflows/build-brush.yml"]
  pull_request:
    paths: ["brush/**", ".github/workflows/build-brush.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  BRUSH_REV: 38185dedaf8143988a31a64c1f27c2323b1febdf
  RUST_TOOLCHAIN: "1.95.0"
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      BRUSH_SRC: ${{ github.workspace }}/../brush-src
      CARGO_TARGET_DIR: ${{ github.workspace }}/../brush-target
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/brush-v* ]]; then v="${GITHUB_REF#refs/tags/brush-v}"; else v="dev-${GITHUB_SHA::8}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "patches=${{ hashFiles('brush/patches/*.patch', 'brush/build.sh') }}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.TARGET }}

      # glibc 2.28 baseline (runs on any distro from ~2018 on).
      - name: Install cargo-zigbuild
        run: python3 -m pip install "cargo-zigbuild==0.20.1" "ziglang==0.13.0"

      - name: Prepare sources
        run: brush/build.sh --prepare

      - uses: Swatinem/rust-cache@v2.8.0
        with:
          workspaces: ${{ env.BRUSH_SRC }} -> ${{ env.CARGO_TARGET_DIR }}
          key: ${{ env.TARGET }}-${{ env.BRUSH_REV }}-${{ steps.ver.outputs.patches }}
          shared-key: brush-cli

      - name: Build
        run: brush/build.sh --zigbuild --target "$TARGET.2.28" --out dist/bin

      - name: Smoke test
        run: |
          dist/bin/brush-cli --help | grep -q -- "--total-train-iters"
          dist/bin/brush-cli --help | grep -q -- "--depth-distortion-weight"
          dist/bin/brush-cli render --help | grep -q -- "--cameras"

      - name: Package
        id: pkg
        run: |
          name="brush-cli-${{ steps.ver.outputs.version }}-linux-x64"
          mkdir -p dist/pkg
          cp dist/bin/brush-cli dist/pkg/
          cp "$BRUSH_SRC/LICENSE" dist/pkg/LICENSE-brush.txt
          cp brush/patches/*.patch dist/pkg/
          file="$name.tar.xz"
          tar -C dist/pkg -cJf "dist/$file" .
          (cd dist && sha256sum "$file" | awk '{print $1}' > "$file.sha256" && cat "$file.sha256")
          echo "file=dist/$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: brush-cli-linux-x64
          path: |
            ${{ steps.pkg.outputs.file }}
            ${{ steps.pkg.outputs.file }}.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/brush-v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2.3.2
        with:
          files: dist/*
          body: |
            brush-cli (Linux x86-64, glibc >= 2.28) built from Brush ${{ env.BRUSH_REV }}
            with gausify-orbit's brush-js/deg/geom/render patches and gausify-cli.patch (all included).

  # Releases made with GITHUB_TOKEN don't trigger `release` workflows: open
  # the manifest PR from here.
  manifest:
    if: startsWith(github.ref, 'refs/tags/brush-v')
    needs: release
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/update-manifest.yml
    with:
      tag: ${{ github.ref_name }}
