name: Build brush-cli

# brush-cli = Brush 38185de + gausify-orbit's patches + gausify-cli.patch
# (brush/build.sh). Tag `brush-vX.Y.Z` to publish a release; the manifest PR
# (gausify/binaries.json) follows via update-manifest.yml.

on:
  push:
    tags: ["brush-v*"]
    branches: [main]
    paths: ["brush/**", ".github/workflows/build-brush.yml"]
  pull_request:
    paths: ["brush/**", ".github/workflows/build-brush.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  BRUSH_REV: 38185dedaf8143988a31a64c1f27c2323b1febdf
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            build_args: --zigbuild --target x86_64-unknown-linux-gnu.2.28
            exe: brush-cli
          - os: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            build_args: --target x86_64-pc-windows-msvc
            exe: brush-cli.exe
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      # LF everywhere: the patches must apply to Brush's LF sources and
      # build.sh must run under bash.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4.2.2

      - name: Paths
        run: |
          tmp="$RUNNER_TEMP"
          if command -v cygpath > /dev/null; then tmp="$(cygpath -m "$tmp")"; fi
          echo "BRUSH_SRC=$tmp/brush-src" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$tmp/brush-target" >> "$GITHUB_ENV"

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/brush-v* ]]; then v="${GITHUB_REF#refs/tags/brush-v}"; else v="dev-${GITHUB_SHA::8}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "patches=${{ hashFiles('brush/patches/*.patch', 'brush/build.sh') }}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: contains(matrix.build_args, 'zigbuild')
        run: python3 -m pip install "cargo-zigbuild==0.20.1" "ziglang==0.13.0"

      - name: Prepare sources
        run: brush/build.sh --prepare

      - uses: Swatinem/rust-cache@v2.8.0
        with:
          workspaces: ${{ env.BRUSH_SRC }} -> ${{ env.CARGO_TARGET_DIR }}
          key: ${{ matrix.target }}-${{ env.BRUSH_REV }}-${{ steps.ver.outputs.patches }}
          shared-key: brush-cli

      - name: Build
        run: brush/build.sh ${{ matrix.build_args }} --out dist/bin

      - name: Smoke test
        run: |
          dist/bin/${{ matrix.exe }} --help | grep -q -- "--total-train-iters"
          dist/bin/${{ matrix.exe }} --help | grep -q -- "--depth-distortion-weight"
          dist/bin/${{ matrix.exe }} render --help | grep -q -- "--cameras"

      - name: Package
        id: pkg
        run: |
          name="brush-cli-${{ steps.ver.outputs.version }}-${{ matrix.platform }}"
          mkdir -p dist/pkg
          cp dist/bin/${{ matrix.exe }} dist/pkg/
          cp "$BRUSH_SRC/LICENSE" dist/pkg/LICENSE-brush.txt
          cp brush/patches/*.patch dist/pkg/
          cd dist/pkg
          if [ "${{ matrix.platform }}" = windows-x64 ]; then
            file="$name.zip"
            7z a -tzip "../$file" ./* > /dev/null
          else
            file="$name.tar.xz"
            tar -cJf "../$file" ./*
          fi
          cd ..
          sha256sum "$file" | awk '{print $1}' > "$file.sha256"
          cat "$file.sha256"
          echo "file=dist/$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: brush-cli-${{ matrix.platform }}
          path: |
            ${{ steps.pkg.outputs.file }}
            ${{ steps.pkg.outputs.file }}.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/brush-v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2.3.2
        with:
          files: dist/*
          body: |
            brush-cli built from Brush ${{ env.BRUSH_REV }} with gausify-orbit's
            brush-js/deg/geom/render patches and gausify-cli.patch (all included).

  # Releases made with GITHUB_TOKEN don't trigger `release` workflows: open
  # the manifest PR from here.
  manifest:
    if: startsWith(github.ref, 'refs/tags/brush-v')
    needs: release
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/update-manifest.yml
    with:
      tag: ${{ github.ref_name }}
